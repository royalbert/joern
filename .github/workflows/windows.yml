name: windows
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # On demand only: run from the Actions tab, or label a pull request "windows". Upstream's CI tests on
  # Windows too, so a fix filed upstream should pass here first.
  run-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
      - name: Run the tests of the modules Firmative's changes touch
        run: sbt "x2cpg/testFull ; c2cpg/testFull ; javasrc2cpg/testFull ; dataflowengineoss/testFull"
      - name: Run the integration tests
        run: sbt "c2cpg/stage ; integrationTests/testFull"
